name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Validate stacked PRs against their real base as well as PRs into main.
  # Do not let a non-main PR silently bypass the same required suites.
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR checks, but never cancel a main quality gate.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Single source of truth for the dependency pins; every install step below
# references these so a bump is one edit, not a grep-replace across jobs.
# RIVET stays for the unchanged engine (contract tooling + tests + the signed
# update feed); GLAZE is the UI/host framework (issue #141). Rivet's own
# dependency, keel, resolves from the package catalog (keel main) through
# `raco pkg install --auto` — the 2026-10 collision pin is gone (issue #129).
env:
  RIVET_PIN: 0db8b76396f70dde6d0a9c7935a0bd91d8c066f3
  GLAZE_PIN: f50e9fc133b1c4e08b56e5f9661e7d6672dbcfa6
jobs:
  contract:
    name: Contract preflight (i18n + release metadata + generated surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify i18n sources are coherent
        run: scripts/sync-i18n.sh --check
      - name: Verify release version alignment
        run: bash scripts/check-release-version.sh
      - name: Check release script shell syntax
        run: |
          set -euo pipefail
          for script in scripts/check-release-version.sh scripts/check-release-signing-key.sh scripts/test-release-signing-key.sh scripts/make-update-manifest.sh scripts/update-keys.sh; do
            bash -n "$script"
          done
      - name: Reject invalid release signing keys (offline)
        run: bash scripts/test-release-signing-key.sh
      - name: Check canonical signed artifact and update-feed URLs
        run: python3 scripts/check-update-feed-urls.py
      - name: Verify dependency pins stay aligned
        run: bash scripts/check-dependency-pins.sh
      # Generated surfaces are do-not-edit: regenerate and require a clean
      # diff, so a schema/i18n change can never ship a stale rpc.ts/i18n.ts.
      - name: Generated RPC types and web i18n are fresh
        run: |
          set -euo pipefail
          python3 scripts/gen-rpc-types.py
          python3 scripts/gen-web-i18n.py
          git diff --exit-code -- packages/core/src/rpc.ts apps/desktop/src/i18n.ts
      - name: RPC surface gate (glaze routes == rivet schema)
        run: python3 scripts/check-rpc-surface.py

  frontend:
    name: Web UI (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm check
      - name: Build frontend
        run: pnpm build

  core:
    name: Racket core (engine contract tests, unchanged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Racket CS 9.3
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog; pulls keel from the catalog)
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Schema baseline is compatible
        run: raco rivet schema check rivet-schema.json --json
        shell: bash
      - name: Core contract tests
        run: raco test racket/
      # Golden CLI suite: byte-identical stdout/stderr/exit codes
      # against shared/cli-golden/, run through the system-racket CLI shim.
      - name: Golden CLI suite
        run: python3 shared/cli-golden/runner.py --binary scripts/taskly-cli.sh

  backend:
    name: Glaze adapter (${{ matrix.os }} compile + tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Racket CS 9.3
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.os == 'macos-latest' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
          version: '9.3'
      # Racket 9.3 occasionally crashes on a malformed GitHub-hosted
      # Windows root-store entry (X509*->C #f). Re-export valid trust anchors
      # from THIS machine as PEM. TLS/hostname verification stays enabled.
      - name: Export trusted Windows root certificates for Racket TLS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'taskly-trusted-roots.pem'
          $certs = @()
          foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root')) {
            foreach ($cert in (Get-ChildItem -Path $store)) {
              try {
                $raw = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
                if ($raw.Length -gt 0) {
                  $base64 = [Convert]::ToBase64String(
                    $raw, [Base64FormattingOptions]::InsertLineBreaks)
                  $certs += "-----BEGIN CERTIFICATE-----`n$base64`n-----END CERTIFICATE-----"
                }
              } catch {
                Write-Warning "Skipped an unreadable root certificate entry"
              }
            }
          }
          if ($certs.Count -lt 10) {
            throw 'Windows root CA export returned too few anchors; refusing to bypass TLS'
          }
          [IO.File]::WriteAllText($path, ($certs -join "`n"), [Text.Encoding]::ASCII)
          "TASKLY_WINDOWS_TRUSTED_ROOTS=$path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install glaze + engine deps (verified Windows trust roots)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
            racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
            racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs crypto
          else
            bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
            bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
            bash scripts/install-racket-packages-with-retry.sh crypto
          fi
      - name: Compile adapter + thin host
        run: raco make backend/main.rkt
      - name: Adapter contract tests (28 RPC routes over the real engine)
        run: racket backend/tests/adapter-test.rkt
      - name: Glaze schema baseline is compatible
        run: raco glaze schema check --json

  package-smoke:
    name: Linux package + HTTP adapter smoke
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Install WebKitGTK and Xvfb (glaze Linux runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Setup Racket CS 9.3
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      - name: Package (Linux portable)
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$(tr -d '[:space:]' < VERSION)" \
            --identifier app.taskly.Taskly \
            --out dist
      - name: HTTP adapter smoke (packaged binary serves API and frontend)
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          export TASKLY_TRANSPORT=http GLAZE_API_TOKEN=smoke-token
          BIN="$(find dist -type f -name 'Taskly' ! -name '*.sha256' | head -1)"
          test -n "$BIN" || { echo "::error::packaged binary not found"; ls -R dist | head -40; exit 1; }
          chmod +x "$BIN"
          cd "$(dirname "$BIN")"
          setsid xvfb-run -a "./$(basename "$BIN")" &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          # setsid detaches the app from $!, so probe every listening TCP
          # port system-wide; the token-protected health endpoint decides
          # which port is the app (family policy).
          port=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$run_pid" 2>/dev/null || { echo "::error::packaged app exited early"; exit 1; }
            ports="$(lsof -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u || true)"
            for p in $ports; do
              if curl -fsS -m 5 -X POST -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                port="$p"; break
              fi
            done
            [ -n "$port" ] && break
          done
          [ -n "$port" ] || { echo "::error::packaged app never listened"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }
          # One real RPC round-trip through the packaged adapter.
          curl -fsS -m 5 -X POST -H "X-Glaze-Token: smoke-token" \
            -H 'Content-Type: application/json' -d '{}' \
            "http://127.0.0.1:$port/api/rpc/get_settings" | grep -q '"language"'