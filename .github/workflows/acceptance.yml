name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
  KEEL_PIN: 76a5b9fdd01bde284d310ff5c05ec73972f64201

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      # Racket 9.3's Windows root-store importer can crash on an invalid
      # runner certificate (X509*->C #f). Export valid local trust anchors
      # from the current GitHub runner only; no third-party CA downloads.
      # and keep TLS certificate/hostname verification enabled.
      - name: Export trusted Windows root certificates for Racket TLS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'taskly-trusted-roots.pem'
          $certs = @()
          foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root')) {
            foreach ($cert in (Get-ChildItem -Path $store)) {
              try {
                $raw = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
                if ($raw.Length -gt 0) {
                  $base64 = [Convert]::ToBase64String(
                    $raw, [Base64FormattingOptions]::InsertLineBreaks)
                  $certs += "-----BEGIN CERTIFICATE-----`n$base64`n-----END CERTIFICATE-----"
                }
              } catch {
                Write-Warning "Skipped an unreadable root certificate entry"
              }
            }
          }
          if ($certs.Count -lt 10) {
            throw 'Windows root CA export returned too few anchors; refusing to bypass TLS'
          }
          [IO.File]::WriteAllText($path, ($certs -join "`n"), [Text.Encoding]::ASCII)
          "TASKLY_WINDOWS_TRUSTED_ROOTS=$path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned dependencies (verified Windows trust roots)
        shell: pwsh
        run: |
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/keel.git#$env:KEEL_PIN"
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/rivet.git#$env:RIVET_PIN"
      - name: Verify Windows installer artwork
        shell: pwsh
        run: python scripts/check-windows-installer-bitmaps.py
      - name: Run executable acceptance contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .rivet\acceptance | Out-Null
          $report = & raco rivet acceptance --json
          $status = $LASTEXITCODE
          $report | Tee-Object -FilePath .rivet\acceptance\report.json
          exit $status
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-windows
          path: .rivet/acceptance
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned dependencies
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - name: Render DMG artwork from SVG
        run: |
          brew install librsvg
          bash scripts/render-dmg-background.sh
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          raco rivet acceptance --json | tee .rivet/acceptance/report.json
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      - name: Install native and pinned Racket dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11 libgtk-4-dev \
            libadwaita-1-dev libjson-glib-dev libsecret-1-dev python3-pyatspi weston
          raco pkg install --auto --no-docs "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          raco pkg install --auto --no-docs --skip-installed db crypto
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn
