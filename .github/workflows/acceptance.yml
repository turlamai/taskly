name: Product Acceptance

on:
  push:
    branches: [main]
  # Validate stacked PRs against their real base as well as PRs into main.
  # Do not let a non-main PR silently bypass the same required suites.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every main Product Acceptance run; cancel only stale PR revisions.
  group: acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RIVET_PIN: 0300b194cd24d8b91eed263c9dee30c75ddc4e59
  KEEL_PIN: 76a5b9fdd01bde284d310ff5c05ec73972f64201

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      # Racket 9.3's Windows root-store importer can crash on an invalid
      # runner certificate (X509*->C #f). Export valid local trust anchors
      # from the current GitHub runner only; no third-party CA downloads.
      # and keep TLS certificate/hostname verification enabled.
      - name: Export trusted Windows root certificates for Racket TLS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'taskly-trusted-roots.pem'
          $certs = @()
          foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root')) {
            foreach ($cert in (Get-ChildItem -Path $store)) {
              try {
                $raw = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
                if ($raw.Length -gt 0) {
                  $base64 = [Convert]::ToBase64String(
                    $raw, [Base64FormattingOptions]::InsertLineBreaks)
                  $certs += "-----BEGIN CERTIFICATE-----`n$base64`n-----END CERTIFICATE-----"
                }
              } catch {
                Write-Warning "Skipped an unreadable root certificate entry"
              }
            }
          }
          if ($certs.Count -lt 10) {
            throw 'Windows root CA export returned too few anchors; refusing to bypass TLS'
          }
          [IO.File]::WriteAllText($path, ($certs -join "`n"), [Text.Encoding]::ASCII)
          "TASKLY_WINDOWS_TRUSTED_ROOTS=$path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned dependencies (verified Windows trust roots)
        shell: pwsh
        run: |
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/keel.git#$env:KEEL_PIN"
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/rivet.git#$env:RIVET_PIN"
      # First-run acceptance installs the packaged MSI for real, so the
      # WiX toolchain ships in this job (the trust-roots wrapper above
      # covers the Racket TLS legs of the same install).
      - name: Install WiX (v5; MSI packaging for installed-app acceptance)
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Verify Windows installer artwork
        shell: pwsh
        run: python scripts/check-windows-installer-bitmaps.py
      - name: Run executable acceptance contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .rivet\acceptance | Out-Null
          $report = & raco rivet acceptance --json
          $status = $LASTEXITCODE
          $report | Tee-Object -FilePath .rivet\acceptance\report.json
          exit $status
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-windows
          path: .rivet/acceptance
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      # Cache only pinned Racket packages, not app source, host builds, or
      # acceptance evidence. A pin or architecture change invalidates cache.
      - name: Isolate Racket dependency packages
        run: echo "PLTADDONDIR=$RUNNER_TEMP/taskly-racket-addons" >> "$GITHUB_ENV"
      - name: Restore pinned Racket dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/taskly-racket-addons
          key: taskly-macos-racket93-v1-${{ matrix.arch }}-${{ env.RIVET_PIN }}-${{ env.KEEL_PIN }}
      # Always execute the original dependency-install verification below.
      # --skip-installed reuses the restored packages when present.
      - name: Install pinned dependencies
        run: |
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - name: Render DMG artwork from SVG
        run: |
          brew install librsvg
          bash scripts/render-dmg-background.sh
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          raco rivet acceptance --json | tee .rivet/acceptance/report.json
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    # A single Racket catalog request can consume its built-in 30-minute
    # timeout. Leave room for one bounded retry plus the actual product run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@0300b194cd24d8b91eed263c9dee30c75ddc4e59
      - name: Install native and pinned Racket dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11 libgtk-4-dev \
            desktop-file-utils file libadwaita-1-dev libjson-glib-dev \
            libsecret-1-dev python3-pyatspi rpm weston xvfb openbox x11-utils xdotool
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          bash scripts/install-racket-packages-with-retry.sh db-lib crypto-lib
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn
