name: Product Acceptance

on:
  push:
    branches: [main]
  # Validate stacked PRs against their real base as well as PRs into main.
  # Do not let a non-main PR silently bypass the same required suites.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every main Product Acceptance run; cancel only stale PR revisions.
  group: acceptance-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Same pins as ci.yml (scripts/check-dependency-pins.sh gates the alignment).
env:
  RIVET_PIN: 33de65ccb5d72f9ac38ff982aa4495467f89f213
  KEEL_PIN: 76a5b9fdd01bde284d310ff5c05ec73972f64201
  GLAZE_PIN: 89d1a94ce95afee7ab45f3c74dabd63bedce184c

# Executable acceptance for the glaze rewrite (issue #141): verify.rkt boots
# the REAL packaged-shape app (thin host + web UI + in-process engine) in a
# real window on every platform and asserts the product journeys verdict by
# verdict, with screenshots as evidence. Slice 5 extends the journey set and
# re-lands the acceptance contract manifest on this runner shape.
jobs:
  windows:
    name: Windows glaze window acceptance
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      # Racket 9.3's Windows root-store importer can crash on an invalid
      # runner certificate (X509*->C #f). Export valid local trust anchors
      # from the current GitHub runner only; TLS verification stays enabled.
      - name: Export trusted Windows root certificates for Racket TLS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'taskly-trusted-roots.pem'
          $certs = @()
          foreach ($store in @('Cert:\LocalMachine\Root', 'Cert:\CurrentUser\Root')) {
            foreach ($cert in (Get-ChildItem -Path $store)) {
              try {
                $raw = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
                if ($raw.Length -gt 0) {
                  $base64 = [Convert]::ToBase64String(
                    $raw, [Base64FormattingOptions]::InsertLineBreaks)
                  $certs += "-----BEGIN CERTIFICATE-----`n$base64`n-----END CERTIFICATE-----"
                }
              } catch {
                Write-Warning "Skipped an unreadable root certificate entry"
              }
            }
          }
          if ($certs.Count -lt 10) {
            throw 'Windows root CA export returned too few anchors; refusing to bypass TLS'
          }
          [IO.File]::WriteAllText($path, ($certs -join "`n"), [Text.Encoding]::ASCII)
          "TASKLY_WINDOWS_TRUSTED_ROOTS=$path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned dependencies (verified Windows trust roots)
        shell: pwsh
        run: |
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/keel.git#$env:KEEL_PIN"
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/rivet.git#$env:RIVET_PIN"
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs "https://github.com/turlamai/glaze.git#$env:GLAZE_PIN"
          racket scripts/ci/windows-raco-pkg.rkt install --auto --no-docs crypto
      - name: Run executable acceptance (all manifest suites, real window)
        shell: pwsh
        run: racket scripts/acceptance/run-suites.rkt
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-windows
          path: |
            .glaze/verify
            .glaze/acceptance
          if-no-files-found: warn

  macos:
    name: macOS glaze window acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned dependencies
        run: |
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
          bash scripts/install-racket-packages-with-retry.sh crypto
      - name: Run executable acceptance (all manifest suites, real window)
        run: racket scripts/acceptance/run-suites.rkt
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-macos-${{ matrix.arch }}
          path: |
            .glaze/verify
            .glaze/acceptance
          if-no-files-found: warn

  linux:
    name: Linux glaze window acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install glaze Linux runtime + headless display session
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-1 \
            xvfb dbus-x11 x11-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned dependencies
        run: |
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          bash scripts/install-racket-packages-with-retry.sh "https://github.com/turlamai/glaze.git#${GLAZE_PIN}"
          bash scripts/install-racket-packages-with-retry.sh crypto
      - name: Run executable acceptance (all manifest suites, real window under Xvfb)
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          dbus-run-session -- xvfb-run -a racket scripts/acceptance/run-suites.rkt
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskly-acceptance-linux
          path: |
            .glaze/verify
            .glaze/acceptance
          if-no-files-found: warn