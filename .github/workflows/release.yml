name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Same pins as ci.yml (scripts/check-dependency-pins.sh gates the alignment).
# RIVET remains release tooling: the unchanged engine's updater verifies the
# rivet-format signed feed, so `raco rivet sign-manifest` still signs it
# (issue #141 Keep clause). GLAZE builds and packages every host. Rivet's
# dependency keel resolves from the package catalog through --auto.
env:
  RIVET_PIN: 33de65ccb5d72f9ac38ff982aa4495467f89f213
  GLAZE_PIN: e2731a3a1440c9cf705f2c0e77b945a3dec05e79
jobs:
  validate:
    name: Validate release tag + signing key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == updater == package.json == tag)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            bash scripts/check-release-version.sh
          else
            bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
          fi
      # Fail-closed: the signed update feed is part of the release contract,
      # so a missing secret stops the release before the expensive builds.
      - name: Require Ed25519 update signing secret before packaging
        if: github.event_name == 'push'
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY is required before release packaging"
            exit 1
          fi
          KEY_PEM="$(mktemp)"
          trap 'rm -f "$KEY_PEM"' EXIT
          chmod 600 "$KEY_PEM"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          bash scripts/check-release-signing-key.sh "$KEY_PEM"

  linux:
    name: Linux package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version + package suffixes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "${{ matrix.arch }}" in
            x64)   DEBARCH=amd64; RPMARCH=x86_64 ;;
            arm64) DEBARCH=arm64; RPMARCH=aarch64 ;;
          esac
          {
            echo "VERSION=$VERSION"
            echo "DEBARCH=$DEBARCH"
            echo "RPMARCH=$RPMARCH"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      # The installer toolchains glaze degrades across: dpkg-deb is stock on
      # ubuntu runners, rpmbuild comes from apt, appimagetool ships as an
      # AppImage (APPIMAGE_EXTRACT_AND_RUN=1 — no FUSE on CI).
      - name: Install packaging toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils file
          case "${{ matrix.arch }}" in
            x64)   TOOLARCH="x86_64" ;;
            arm64) TOOLARCH="aarch64" ;;
          esac
          curl -sL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOLARCH}.AppImage"
          chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true
      - name: Package (deb + rpm + AppImage + portable runtime)
        run: |
          set -euo pipefail
          # --installer runs glaze's native installer chain; the test -f
          # gates turn a silent toolchain degradation into a hard failure.
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --identifier app.taskly.Taskly \
            --installer \
            --out dist
          test -f dist/Taskly.deb
          test -f dist/Taskly.rpm
          test -f dist/Taskly.AppImage
          # Public names keep the historical Taskly matrix (the signed feed
          # and UPDATE.md name the AppImage by uname arch).
          mv dist/Taskly.deb      "taskly-$VERSION-linux-$DEBARCH.deb"
          mv dist/Taskly.rpm      "taskly-$VERSION-linux-$RPMARCH.rpm"
          mv dist/Taskly.AppImage "taskly-$VERSION-linux-$RPMARCH.AppImage"
          (cd dist && tar czf "../taskly-$VERSION-linux-${{ matrix.arch }}.tar.gz" .)
      # Flatpak bundle from the tarball (the Linux distribution contract's
      # last format; flatpak/ manifest describes the glaze payload closure).
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          case "${{ matrix.arch }}" in
            x64)   FPARCH="x86_64" ;;
            arm64) FPARCH="aarch64" ;;
          esac
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          tarball="taskly-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          test -s "$tarball"
          SHA="$(sha256sum "$tarball" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${{ matrix.arch }}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.taskly.yml > site.jrtx.taskly.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.taskly.gen.yml
          flatpak build-bundle flatpak-repo \
            "taskly-$VERSION-linux-${{ matrix.arch }}.flatpak" site.jrtx.taskly stable
          rm -rf flatpak-build flatpak-repo site.jrtx.taskly.gen.yml
          test -f "taskly-$VERSION-linux-${{ matrix.arch }}.flatpak"
      - name: Per-asset .sha256 sidecars
        run: |
          for f in taskly-$VERSION-linux-${{ matrix.arch }}.tar.gz \
                   taskly-$VERSION-linux-$DEBARCH.deb \
                   taskly-$VERSION-linux-$RPMARCH.rpm \
                   taskly-$VERSION-linux-$RPMARCH.AppImage \
                   taskly-$VERSION-linux-${{ matrix.arch }}.flatpak; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            taskly-*-linux-*.tar.gz
            taskly-*-linux-*.tar.gz.sha256
            taskly-*-linux-*.deb
            taskly-*-linux-*.deb.sha256
            taskly-*-linux-*.rpm
            taskly-*-linux-*.rpm.sha256
            taskly-*-linux-*.AppImage
            taskly-*-linux-*.AppImage.sha256
            taskly-*-linux-*.flatpak
            taskly-*-linux-*.flatpak.sha256
          if-no-files-found: error

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      # Ad-hoc signature (family glaze-line baseline): Developer ID +
      # notarization light up in a later slice once the credentials exist;
      # the release title states the trust status explicitly.
      - name: Package app bundle
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --identifier app.taskly.Taskly \
            --icon assets/taskly.icns \
            --sign - \
            --out dist
      - name: Portable zip (.app at the archive root)
        run: |
          (cd dist && zip -qry "../taskly-$VERSION-macos-${{ matrix.arch }}.zip" Taskly.app)
      - name: DMG (drag to Applications)
        run: |
          set -euo pipefail
          dmg="taskly-$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/Taskly.app "$staging/"
          ln -s /Applications "$staging/Applications"
          created=""
          for attempt in 1 2 3; do
            if hdiutil create -volname Taskly -srcfolder "$staging" -ov -format UDZO "$dmg"; then
              created="yes"; break
            fi
            echo "hdiutil create attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          [ -n "$created" ] || { echo "::error::hdiutil create failed after 3 attempts"; exit 1; }
      - name: Verify the update zip preserves the code signature
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/zip-signature-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          ditto -x -k "taskly-$VERSION-macos-${{ matrix.arch }}.zip" "$CHECK_DIR"
          codesign --verify --deep --strict "$CHECK_DIR/Taskly.app"
      - name: Per-asset .sha256 sidecars
        run: |
          for f in taskly-$VERSION-macos-${{ matrix.arch }}.zip taskly-$VERSION-macos-${{ matrix.arch }}.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            taskly-*-macos-*.zip
            taskly-*-macos-*.zip.sha256
            taskly-*-macos-*.dmg
            taskly-*-macos-*.dmg.sha256
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        shell: bash
        run: |
          raco pkg install --auto --no-docs --skip-installed 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs --skip-installed 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          raco pkg install --auto --no-docs --skip-installed crypto
      # WiX pinned to v5.0.2 (family MSI toolchain): v7 gates builds behind
      # the OSMF EULA acceptance (WIX7015). glaze falls back to NSIS, then
      # zip, by tool availability — the test -f gate makes that a failure.
      - name: Install WiX (v5)
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package (MSI + portable runtime)
        shell: bash
        run: |
          set -euo pipefail
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --publisher 'Turing Lambda' \
            --identifier app.taskly.Taskly \
            --icon assets/taskly.ico \
            --installer \
            --out dist
          test -f dist/Taskly.msi
          mv dist/Taskly.msi "taskly-$VERSION-windows-x64.msi"
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "taskly-$env:VERSION-windows-x64.zip"
      - name: Per-asset .sha256 sidecars
        shell: bash
        run: |
          sha256sum taskly-$VERSION-windows-x64.zip > taskly-$VERSION-windows-x64.zip.sha256
          sha256sum taskly-$VERSION-windows-x64.msi > taskly-$VERSION-windows-x64.msi.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            taskly-*-windows-x64.zip
            taskly-*-windows-x64.zip.sha256
            taskly-*-windows-x64.msi
            taskly-*-windows-x64.msi.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The signed feed is rivet-format (the unchanged engine verifies it):
      # signing needs rivet's sign-manifest + the crypto package's libcrypto.
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install rivet + crypto (feed signing + release update suite)
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Release-kind acceptance (#58): signed-feed rejection, download
      # cancel, the N→N+1 lifecycle, and data preservation must pass on the
      # exact tree being published — bound here so a release cannot ship
      # without its update evidence.
      - name: Release update suite (signed-reject, cancel, N→N+1, data preservation)
        run: raco test racket/tests/release-update-test.rkt
      - name: Verify payload set and build SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip \
            macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-x64.tar.gz linux-arm64.tar.gz \
            linux-amd64.deb linux-arm64.deb \
            linux-x86_64.rpm linux-aarch64.rpm \
            linux-x86_64.AppImage linux-aarch64.AppImage \
            linux-x64.flatpak linux-arm64.flatpak; do
            name="taskly-$VERSION-$suffix"
            test -s "artifacts/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "artifacts/$name" public/
          done
          expected=16
          found="$(find public -maxdepth 1 -type f | wc -l)"
          test "$found" -eq "$expected" || { echo "::error::public/ holds $found files, expected $expected"; exit 1; }
          (cd public && sha256sum taskly-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check SHA256SUMS)
          test "$(grep -c '^' public/SHA256SUMS)" -eq "$expected"
      # The signed update feed is a release asset (the engine updater reads
      # releases/latest/download/update-manifest.json). Fail-closed.
      - name: Sign and require trusted update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${UPDATE_ED25519_PRIVATE_KEY:-}" ]] || {
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; refusing unsigned release"
            exit 1
          }
          umask 077
          KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$KEY_PEM"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          bash scripts/check-release-signing-key.sh "$KEY_PEM"
          scripts/make-update-manifest.sh "$GITHUB_REF_NAME" public "$KEY_PEM"
          test -s public/update-manifest.json || {
            echo "::error::Signed update manifest missing; refusing to publish"
            exit 1
          }
          test "$(find public -maxdepth 1 -type f | wc -l)" -eq 18
      - name: Extract changelog section
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md || { echo "::error::CHANGELOG.md lacks release notes for $VERSION"; exit 1; }
      - name: Create or update the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Normal releases, not prereleases: the updater reads the moving
          # releases/latest/download manifest and GitHub's `latest` resolves
          # only non-prerelease releases. The title states the trust status
          # (ad-hoc macOS signature until Developer ID credentials land).
          title="Taskly ${VERSION} (unsigned evaluation)"
          mapfile -t uploads < <(awk '{print $2}' public/SHA256SUMS)
          uploads+=( SHA256SUMS update-manifest.json )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file RELEASE-NOTES.md --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --latest --notes-file RELEASE-NOTES.md
          fi
          (cd public && gh release upload "$GITHUB_REF_NAME" --clobber "${uploads[@]}")
          # A retry against a partially published tag must also remove old
          # sidecars and stale aliases; --clobber only replaces matching names.
          mapfile -t published < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for name in "${published[@]}"; do
            if ! printf '%s\n' "${uploads[@]}" | grep -Fxq "$name"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            fi
          done
      # Family standard: every public release asset carries verifiable build
      # provenance. The globs match exactly the published matrix.
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            public/taskly-*
            public/SHA256SUMS
            public/update-manifest.json