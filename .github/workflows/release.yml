name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Same pins as ci.yml (scripts/check-dependency-pins.sh gates the alignment).
# RIVET remains release tooling: the unchanged engine's updater verifies the
# rivet-format signed feed, so `raco rivet sign-manifest` still signs it
# (issue #141 Keep clause). GLAZE builds and packages every host. Rivet's
# dependency keel resolves from the package catalog through --auto.
env:
  RIVET_PIN: 0db8b76396f70dde6d0a9c7935a0bd91d8c066f3
  GLAZE_PIN: f50e9fc133b1c4e08b56e5f9661e7d6672dbcfa6
jobs:
  validate:
    name: Validate release tag + signing key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == updater == package.json == tag)
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            bash scripts/check-release-version.sh
          else
            bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
          fi
      # Fail-closed: the signed update feed is part of the release contract,
      # so a missing secret stops the release before the expensive builds.
      - name: Require Ed25519 update signing secret before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY is required before release packaging"
            exit 1
          fi
          KEY_PEM="$(mktemp)"
          trap 'rm -f "$KEY_PEM"' EXIT
          chmod 600 "$KEY_PEM"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          bash scripts/check-release-signing-key.sh "$KEY_PEM"
      # Same fail-closed rule for the macOS publisher identity (issue #80): a
      # tag release is Developer ID signed and notarized, so missing signing
      # secrets stop here rather than after the platform builds.
      - name: Require macOS signing secrets before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_P12_B64 DEVELOPER_ID_P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for a production tag release"
              exit 1
            fi
          done

  linux:
    name: Linux package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version + package suffixes
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "${{ matrix.arch }}" in
            x64)   DEBARCH=amd64; RPMARCH=x86_64 ;;
            arm64) DEBARCH=arm64; RPMARCH=aarch64 ;;
          esac
          {
            echo "VERSION=$VERSION"
            echo "DEBARCH=$DEBARCH"
            echo "RPMARCH=$RPMARCH"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      # The installer toolchains glaze degrades across: dpkg-deb is stock on
      # ubuntu runners, rpmbuild comes from apt, appimagetool ships as an
      # AppImage (APPIMAGE_EXTRACT_AND_RUN=1 — no FUSE on CI).
      - name: Install packaging toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils file
          case "${{ matrix.arch }}" in
            x64)   TOOLARCH="x86_64" ;;
            arm64) TOOLARCH="aarch64" ;;
          esac
          curl -sL -o /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${TOOLARCH}.AppImage"
          chmod +x /usr/local/bin/appimagetool
          appimagetool --version || true
      - name: Package (deb + rpm + AppImage + portable runtime)
        run: |
          set -euo pipefail
          # --installer runs glaze's native installer chain; the test -f
          # gates turn a silent toolchain degradation into a hard failure.
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --identifier app.taskly.Taskly \
            --installer \
            --out dist
          test -f dist/Taskly.deb
          test -f dist/Taskly.rpm
          test -f dist/Taskly.AppImage
          # Public names keep the historical Taskly matrix (the signed feed
          # and UPDATE.md name the AppImage by uname arch).
          mv dist/Taskly.deb      "taskly-$VERSION-linux-$DEBARCH.deb"
          mv dist/Taskly.rpm      "taskly-$VERSION-linux-$RPMARCH.rpm"
          mv dist/Taskly.AppImage "taskly-$VERSION-linux-$RPMARCH.AppImage"
          # AppDir is appimagetool's staging tree (a duplicate launcher, icon
          # and desktop file), not part of the portable runtime. Listing the
          # payload at the shell level keeps this independent of tar's
          # --exclude pattern semantics.
          (cd dist && tar czf "../taskly-$VERSION-linux-${{ matrix.arch }}.tar.gz" \
            $(ls -A | grep -v '^AppDir$'))
      # Flatpak bundle from the tarball (the Linux distribution contract's
      # last format; flatpak/ manifest describes the glaze payload closure).
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          case "${{ matrix.arch }}" in
            x64)   FPARCH="x86_64" ;;
            arm64) FPARCH="aarch64" ;;
          esac
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          tarball="taskly-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          test -s "$tarball"
          SHA="$(sha256sum "$tarball" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${{ matrix.arch }}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.taskly.yml > site.jrtx.taskly.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.taskly.gen.yml
          flatpak build-bundle flatpak-repo \
            "taskly-$VERSION-linux-${{ matrix.arch }}.flatpak" site.jrtx.taskly stable
          rm -rf flatpak-build flatpak-repo site.jrtx.taskly.gen.yml
          test -f "taskly-$VERSION-linux-${{ matrix.arch }}.flatpak"
      - name: Per-asset .sha256 sidecars
        run: |
          for f in taskly-$VERSION-linux-${{ matrix.arch }}.tar.gz \
                   taskly-$VERSION-linux-$DEBARCH.deb \
                   taskly-$VERSION-linux-$RPMARCH.rpm \
                   taskly-$VERSION-linux-$RPMARCH.AppImage \
                   taskly-$VERSION-linux-${{ matrix.arch }}.flatpak; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            taskly-*-linux-*.tar.gz
            taskly-*-linux-*.tar.gz.sha256
            taskly-*-linux-*.deb
            taskly-*-linux-*.deb.sha256
            taskly-*-linux-*.rpm
            taskly-*-linux-*.rpm.sha256
            taskly-*-linux-*.AppImage
            taskly-*-linux-*.AppImage.sha256
            taskly-*-linux-*.flatpak
            taskly-*-linux-*.flatpak.sha256
          if-no-files-found: error

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    env:
      # Production signing applies whenever the account-level secrets exist
      # (Developer ID p12 + App Store Connect API key). Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see glaze docs/production-signing.md
      # and the family release.yml shape. Glaze signs with --sign (hardened
      # runtime for real identities); this workflow notarizes the artifacts it
      # actually ships — the portable zip's .app and the hand-built DMG —
      # because glaze's own --notarize would staple a throwaway DMG.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts (issue #80).
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY_NAME" >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      - name: Package app bundle (Developer ID signed)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --identifier app.taskly.Taskly \
            --icon assets/taskly.icns \
            --sign "$MACOS_SIGN_IDENTITY" \
            --out dist
      - name: Package app bundle (ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --identifier app.taskly.Taskly \
            --icon assets/taskly.icns \
            --sign - \
            --out dist
      - name: Release requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      # Notarize the .app and staple the ticket so the portable zip (the
      # update-feed payload) passes Gatekeeper offline. ditto keeps framework
      # symlinks intact: a submission zip must be the exact bundle shape
      # Apple notarizes.
      - name: Notarize + staple the .app
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          SUBMISSION="$RUNNER_TEMP/app-notary.zip"
          rm -f "$SUBMISSION"
          ditto -c -k --keepParent dist/Taskly.app "$SUBMISSION"
          xcrun notarytool submit "$SUBMISSION" --keychain-profile ASC_NOTARY --wait
          xcrun stapler staple dist/Taskly.app
          rm -f "$SUBMISSION"
      - name: Portable zip (.app at the archive root)
        run: |
          (cd dist && zip -qry "../taskly-$VERSION-macos-${{ matrix.arch }}.zip" Taskly.app)
      - name: DMG (drag to Applications)
        run: |
          set -euo pipefail
          dmg="taskly-$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/Taskly.app "$staging/"
          ln -s /Applications "$staging/Applications"
          created=""
          for attempt in 1 2 3; do
            if hdiutil create -volname Taskly -srcfolder "$staging" -ov -format UDZO "$dmg"; then
              created="yes"; break
            fi
            echo "hdiutil create attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          [ -n "$created" ] || { echo "::error::hdiutil create failed after 3 attempts"; exit 1; }
      # The shipped DMG is hand-built above, so notarize and staple it too.
      # Stapling rewrites the file, hence before the .sha256 sidecars.
      - name: Notarize + staple the DMG, verify production trust
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          dmg="taskly-$VERSION-macos-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$dmg" --keychain-profile ASC_NOTARY --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate dist/Taskly.app
          xcrun stapler validate "$dmg"
          codesign --verify --deep --strict dist/Taskly.app
          codesign -dv dist/Taskly.app 2>&1 | grep -E 'Authority=Developer ID|TeamIdentifier'
          spctl --assess --type execute dist/Taskly.app
      - name: Verify the update zip preserves the code signature
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/zip-signature-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          ditto -x -k "taskly-$VERSION-macos-${{ matrix.arch }}.zip" "$CHECK_DIR"
          codesign --verify --deep --strict "$CHECK_DIR/Taskly.app"
      - name: Per-asset .sha256 sidecars
        run: |
          for f in taskly-$VERSION-macos-${{ matrix.arch }}.zip taskly-$VERSION-macos-${{ matrix.arch }}.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            taskly-*-macos-*.zip
            taskly-*-macos-*.zip.sha256
            taskly-*-macos-*.dmg
            taskly-*-macos-*.dmg.sha256
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install glaze + engine deps
        shell: bash
        run: |
          raco pkg install --auto --no-docs --skip-installed 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs --skip-installed 'https://github.com/turlamai/glaze.git#${{ env.GLAZE_PIN }}'
          raco pkg install --auto --no-docs --skip-installed crypto
      # WiX pinned to v5.0.2 (family MSI toolchain): v7 gates builds behind
      # the OSMF EULA acceptance (WIX7015). glaze falls back to NSIS, then
      # zip, by tool availability — the test -f gate makes that a failure.
      - name: Install WiX (v5)
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package (MSI + portable runtime)
        shell: bash
        run: |
          set -euo pipefail
          # 0.2.13 (the line before the 0.1.0 reset) shipped an MSI whose
          # UpgradeCode was derived from a different identifier, so a new
          # package did not see it: two "Taskly" entries, one directory with
          # the old host's files next to Taskly.exe. Installing this package
          # now uninstalls that product first; user data under ~/.taskly is
          # not part of either package and stays.
          raco glaze build \
            --entry backend/main.rkt \
            --name Taskly \
            --version "$VERSION" \
            --publisher 'Turing Lambda' \
            --identifier app.taskly.Taskly \
            --icon assets/taskly.ico \
            --replace-upgrade-code '{D828976E-2BC4-5296-A277-674B7AE6F9A7}' \
            --installer \
            --out dist
          test -f dist/Taskly.msi
          mv dist/Taskly.msi "taskly-$VERSION-windows-x64.msi"
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "taskly-$env:VERSION-windows-x64.zip"
      - name: Per-asset .sha256 sidecars
        shell: bash
        run: |
          sha256sum taskly-$VERSION-windows-x64.zip > taskly-$VERSION-windows-x64.zip.sha256
          sha256sum taskly-$VERSION-windows-x64.msi > taskly-$VERSION-windows-x64.msi.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            taskly-*-windows-x64.zip
            taskly-*-windows-x64.zip.sha256
            taskly-*-windows-x64.msi
            taskly-*-windows-x64.msi.sha256
          if-no-files-found: error

  # Fedora-family rpm lifecycle (issue #80): the rpm has a supported channel
  # only with install / upgrade / remove evidence. The package declares no
  # runtime Requires, so a stock Fedora container is the real install target.
  # The N→N+1 upgrade uses the previous published release's rpm for the same
  # architecture; a manual dispatch of an already-published version exercises
  # the fresh install / remove path only.
  rpm-lifecycle:
    name: Fedora rpm lifecycle (${{ matrix.arch }})
    needs: [validate, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, rpm-arch: x86_64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, rpm-arch: aarch64 }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts
      - name: Resolve version + fetch the previous published rpm
        run: |
          set -euo pipefail
          mkdir -p work
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          rpm="taskly-$VERSION-linux-${{ matrix.rpm-arch }}.rpm"
          test -s "artifacts/$rpm" || { echo "::error::Missing $rpm"; ls -R artifacts; exit 1; }
          cp "artifacts/$rpm" "work/taskly.rpm"
          # Upgrade base = the newest published release strictly below this
          # version (sort -V), so a dispatch of a published version never
          # "upgrades" from a higher pre-reset 0.2.x package.
          prev=""
          for tag in $(gh release list --limit 12 --json tagName --jq '.[].tagName'); do
            candidate="${tag#v}"
            lower="$(printf '%s\n%s\n' "$candidate" "$VERSION" | sort -V | head -1)"
            [ "$lower" = "$candidate" ] && [ "$candidate" != "$VERSION" ] || continue
            prev="$(gh release view "$tag" --json assets --jq ".assets[].name | select(endswith(\"-linux-${{ matrix.rpm-arch }}.rpm\"))" | head -1)"
            if [ -n "$prev" ]; then
              gh release download "$tag" -p "$prev" -D work --clobber
              mv "work/$prev" work/previous.rpm
              break
            fi
          done
          {
            echo "VERSION=$VERSION"
            echo "PREVIOUS_RPM=$prev"
          } >> "$GITHUB_ENV"
          echo "version=$VERSION previous=${prev:-none}"
      - name: Install → upgrade → verify → remove in Fedora
        run: |
          set -euo pipefail
          chmod -R a+rX work
          docker run --rm -v "$PWD/work:/work:ro" -e VERSION -e PREVIOUS_RPM \
            fedora:latest bash -euxc '
            rpm -qp --qf "name=%{NAME} version=%{VERSION}-%{RELEASE} arch=%{ARCH}\n" /work/taskly.rpm
            pkg="$(rpm -qp --qf "%{NAME}" /work/taskly.rpm)"
            if [ -n "$PREVIOUS_RPM" ]; then
              dnf -y -q install /work/previous.rpm
              rpm -q "$pkg" --qf "installed %{VERSION}-%{RELEASE}\n"
              rpm -q "$pkg" --qf "%{VERSION}\n" | grep -Fxv "$VERSION"
              echo "seed" > "$HOME/taskly-data-marker"
              dnf -y -q upgrade /work/taskly.rpm
              echo "upgraded from $PREVIOUS_RPM"
            else
              dnf -y -q install /work/taskly.rpm
              echo "fresh install (no earlier published rpm below this version)"
            fi
            test "$(rpm -q "$pkg" --qf "%{VERSION}")" = "$VERSION"
            rpm -V "$pkg"
            files="$(rpm -ql "$pkg")"
            grep -qx "/usr/bin/Taskly" <<<"$files"
            grep -q "^/usr/share/applications/.*\.desktop$" <<<"$files"
            grep -q "^/usr/share/icons/hicolor/.*/apps/.*\.png$" <<<"$files"
            mkdir -p "$HOME/.taskly" "$HOME/elsewhere"
            echo "config" > "$HOME/.taskly/config.ini"
            echo "db" > "$HOME/elsewhere/taskly.sqlite"
            dnf -y -q remove "$pkg"
            if rpm -q "$pkg" >/dev/null 2>&1; then echo "::error::still installed after remove"; exit 1; fi
            test ! -e /usr/bin/Taskly
            test -z "$(ls /usr/share/applications/ | grep -i taskly || true)"
            test "$(cat "$HOME/.taskly/config.ini")" = "config"
            test "$(cat "$HOME/elsewhere/taskly.sqlite")" = "db"
            if [ -n "$PREVIOUS_RPM" ]; then test "$(cat "$HOME/taskly-data-marker")" = "seed"; fi
            echo "rpm lifecycle ok ($pkg $VERSION)"
            '

  publish:
    name: Publish
    needs: [linux, macos, windows, rpm-lifecycle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      # On a tag push the macOS job has already failed closed without these,
      # so a published release is Developer ID signed + notarized; the title
      # still names the one unsigned payload (Windows MSI, no Authenticode).
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The signed feed is rivet-format (the unchanged engine verifies it):
      # signing needs rivet's sign-manifest + the crypto package's libcrypto.
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install rivet + crypto (feed signing + release update suite)
        run: |
          bash scripts/install-racket-packages-with-retry.sh 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          bash scripts/install-racket-packages-with-retry.sh crypto
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Release-kind acceptance (#58): signed-feed rejection, download
      # cancel, the N→N+1 lifecycle, and data preservation must pass on the
      # exact tree being published — bound here so a release cannot ship
      # without its update evidence.
      - name: Release update suite (signed-reject, cancel, N→N+1, data preservation)
        run: raco test racket/tests/release-update-test.rkt
      - name: Verify payload set and build SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip \
            macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-x64.tar.gz linux-arm64.tar.gz \
            linux-amd64.deb linux-arm64.deb \
            linux-x86_64.rpm linux-aarch64.rpm \
            linux-x86_64.AppImage linux-aarch64.AppImage \
            linux-x64.flatpak linux-arm64.flatpak; do
            name="taskly-$VERSION-$suffix"
            test -s "artifacts/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "artifacts/$name" public/
          done
          expected=16
          found="$(find public -maxdepth 1 -type f | wc -l)"
          test "$found" -eq "$expected" || { echo "::error::public/ holds $found files, expected $expected"; exit 1; }
          (cd public && sha256sum taskly-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum --check SHA256SUMS)
          test "$(grep -c '^' public/SHA256SUMS)" -eq "$expected"
      # The signed update feed is a release asset (the engine updater reads
      # releases/latest/download/update-manifest.json). Fail-closed.
      - name: Sign and require trusted update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${UPDATE_ED25519_PRIVATE_KEY:-}" ]] || {
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; refusing unsigned release"
            exit 1
          }
          umask 077
          KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$KEY_PEM"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          bash scripts/check-release-signing-key.sh "$KEY_PEM"
          scripts/make-update-manifest.sh "$GITHUB_REF_NAME" public "$KEY_PEM"
          test -s public/update-manifest.json || {
            echo "::error::Signed update manifest missing; refusing to publish"
            exit 1
          }
          test "$(find public -maxdepth 1 -type f | wc -l)" -eq 18
      - name: Extract changelog section
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md || { echo "::error::CHANGELOG.md lacks release notes for $VERSION"; exit 1; }
      - name: Create or update the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Normal releases, not prereleases: the updater reads the moving
          # releases/latest/download manifest and GitHub's `latest` resolves
          # only non-prerelease releases. The title states the trust status
          # (issue #80): macOS is production-signed; the Windows MSI is not.
          if [ "$MACOS_SIGNING_CONFIGURED" = "true" ]; then
            title="Taskly ${VERSION} (preview; Windows MSI unsigned)"
          else
            title="Taskly ${VERSION} (unsigned evaluation)"
          fi
          mapfile -t uploads < <(awk '{print $2}' public/SHA256SUMS)
          uploads+=( SHA256SUMS update-manifest.json )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file RELEASE-NOTES.md --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --latest --notes-file RELEASE-NOTES.md
          fi
          (cd public && gh release upload "$GITHUB_REF_NAME" --clobber "${uploads[@]}")
          # A retry against a partially published tag must also remove old
          # sidecars and stale aliases; --clobber only replaces matching names.
          mapfile -t published < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for name in "${published[@]}"; do
            if ! printf '%s\n' "${uploads[@]}" | grep -Fxq "$name"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            fi
          done
      # Family standard: every public release asset carries verifiable build
      # provenance. The globs match exactly the published matrix.
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            public/taskly-*
            public/SHA256SUMS
            public/update-manifest.json