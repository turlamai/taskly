name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: e90f6513419ec2a518629a79e6ce13c37eeefd8b
jobs:
  signing-preflight:
    name: Verify update signing key before native packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Ed25519 private key against both updater trust roots
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY is required before release packaging"
            exit 1
          fi
          KEY_PEM="$(mktemp)"
          trap 'rm -f "$KEY_PEM"' EXIT
          chmod 600 "$KEY_PEM"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          bash scripts/check-release-signing-key.sh "$KEY_PEM"

  macos:
    needs: [signing-preflight]
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        # keel pinned just below the commit that added
        # tests/documentation — it collides with rivet v0.11.0's own
        # tests/documentation module and fails every install (upstream
        # issue filed against keel). Drop this pin once the rename lands.
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/keel.git#76a5b9fdd01bde284d310ff5c05ec73972f64201'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # The Finder DMG uses the PNG, not the editable SVG. Regenerate it so
      # artwork changes always land in the release (Rivet uses a 660x400 view).
      - name: Render DMG artwork from SVG
        run: |
          brew install librsvg
          bash scripts/render-dmg-background.sh
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # release defaults to production mode, so exporting them alone
          # flips packaging over once --development is dropped below.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      # DMG (human installer) + portable zip + SBOM + notices, launch
      # smoke included. The macOS update feed entry is the portable zip,
      # assembled by scripts/make-update-manifest.sh in the publish job.
      # `raco rivet release` defaults to production packaging: with the
      # credentials exported above it Developer ID-signs, notarizes,
      # staples, and re-verifies inside rivet itself.
      - name: Release (DMG + portable zip, Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: raco rivet release --without-updates
      - name: Release (DMG + portable zip, ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: raco rivet release --without-updates --development
      - name: Release requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # rivet (pinned RIVET_PIN) names the portable zip in family form
          # already; only the DMG lacks the architecture.
          mv "taskly-${VERSION}-macos.dmg" "taskly-${VERSION}-macos-${ARCH}.dmg"
          mv sbom.cdx.json "taskly-${VERSION}-macos-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "taskly-${VERSION}-macos-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in taskly-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference (the 1.4.0 leftover). Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256";;
            esac
          done
      # The update feed consumes the portable zip, not the DMG. A zip that
      # flattens framework symlinks ships an app whose signature fails
      # `codesign --deep --strict`; check the exact payload clients install.
      # Production-signed releases additionally re-check the staple and the
      # Gatekeeper policy on the payload after the zip round-trip.
      - name: Verify the update zip preserves the code signature
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          CHECK_DIR="$RUNNER_TEMP/zip-signature-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          ditto -x -k "dist/taskly-${VERSION}-macos-${ARCH}.zip" "$CHECK_DIR"
          codesign --verify --deep --strict "$CHECK_DIR/taskly.app"
          if [[ "$MACOS_SIGNING_CONFIGURED" == "true" ]]; then
            xcrun stapler validate "$CHECK_DIR/taskly.app"
            spctl --assess --type execute "$CHECK_DIR/taskly.app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/taskly-*

  windows:
    needs: [signing-preflight]
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: pwsh
        # keel pinned below the tests/documentation collision commit
        # (upstream issue filed); drop once keel renames the module.
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/keel.git#76a5b9fdd01bde284d310ff5c05ec73972f64201' && raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install WiX (v5; rivet's MSI toolchain)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Install crypto (updater dependency)
        run: raco pkg install --auto --no-docs crypto-lib
        shell: pwsh
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Verify Windows installer checkbox surface
        shell: pwsh
        run: python scripts/check-windows-installer-bitmaps.py
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet (pinned RIVET_PIN) names msi and portable zip in family
          # form already.
          mv sbom.cdx.json "taskly-${VERSION}-windows-x64.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "taskly-${VERSION}-windows-x64-THIRD_PARTY_NOTICES.txt"
          for f in taskly-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference (the 1.4.0 leftover). Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/taskly-*

  linux:
    needs: [signing-preflight]
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@e90f6513419ec2a518629a79e6ce13c37eeefd8b
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. db backs taskly's storage;
      # crypto backs the updater's signing.
      - name: Install Rivet (catalog) and backend packages
        run: |
          # keel pinned below the tests/documentation collision commit
          # (upstream issue filed); drop once keel renames the module.
          raco pkg install --auto --no-docs 'https://github.com/turlamai/keel.git#76a5b9fdd01bde284d310ff5c05ec73972f64201'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs db-lib crypto-lib
      - name: Install GTK4, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libglib2.0-dev cmake ninja-build pkg-config file \
            rpm desktop-file-utils
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # tar.gz (the update-feed payload) + deb + rpm + AppImage + portable
      # zip + SBOM, launch smoke included. The AppImage carries its own
      # GTK4 dependency closure; APPIMAGE_EXTRACT_AND_RUN lets
      # appimagetool run on the runner.
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      # Wraps the tar.gz payload into a Flatpak bundle from the flatpak/
      # manifest template (family contract: deb+rpm+AppImage+Flatpak+tar.gz).
      # The manifest's module closure covers the two NEEDED entries outside
      # the GNOME Platform runtime (liblz4.so.1, libtinfo.so.6). Like deb/rpm,
      # the flatpak install shape is manual-by-design and stays out of the
      # signed update feed.
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc covers the
          # ubuntu-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/taskly-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "taskly-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.taskly.yml > site.jrtx.taskly.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.taskly.gen.yml
          flatpak build-bundle flatpak-repo \
            "taskly-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.taskly stable
          mv "taskly-${VERSION}-linux-${ARCH}.flatpak" dist/
          rm -rf flatpak-build flatpak-repo \
            "taskly-${VERSION}-linux-${ARCH}.tar.gz" site.jrtx.taskly.gen.yml
          test -f "dist/taskly-${VERSION}-linux-${ARCH}.flatpak"
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          mv sbom.cdx.json "taskly-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "taskly-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in taskly-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/notices/wixpdb bodies stay in the CI artifact only;
              # a sidecar without its body on the release is a dangling
              # reference (the 1.4.0 leftover). Checksum what we upload.
              *.sbom.cdx.json | *-THIRD_PARTY_NOTICES.txt | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/taskly-*

  publish:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        # keel pinned just below the commit that added
        # tests/documentation — it collides with rivet v0.11.0's own
        # tests/documentation module and fails every install (upstream
        # issue filed against keel). Drop this pin once the rename lands.
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/keel.git#76a5b9fdd01bde284d310ff5c05ec73972f64201'
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Release-kind acceptance (#58): signed-feed rejection, download
      # cancel, the N→N+1 lifecycle, and data preservation must pass on
      # the exact tree being published — bound here so a release cannot
      # ship without its update evidence.
      - name: Release update suite (signed-reject, cancel, N→N+1, data preservation)
        run: raco test racket/tests/release-update-test.rkt
      - name: Gather + sign the update feed + publish
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
          mkdir -p dist
          # cp -R merges: rivet releases leave a dist/taskly-linux-<arch>/
          # staging bundle in the artifacts, and a plain mv dies on the
          # directory collision ("Directory not empty").
          for a in macos-arm64 macos-x64 windows linux-x64 linux-arm64; do
            cp -R "artifacts/$a/." dist/
          done
          # All supported hosts require the signed release feed for
          # in-app updates. Never publish an un-updatable release if the
          # signing secret is missing, malformed, or signing fails.
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY is missing; refusing to publish without a signed update manifest"
            exit 1
          fi
          KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          chmod 600 "$KEY_PEM"
          # Re-check immediately before publication; never silently downgrade.
          bash scripts/check-release-signing-key.sh "$KEY_PEM"
          scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_PEM"
          test -s dist/update-manifest.json || {
            echo "::error::Signed update manifest was not generated"
            exit 1
          }
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          if [[ ! -s /tmp/notes.md ]]; then
            echo "::error::CHANGELOG.md lacks release notes for ${VERSION}"
            exit 1
          fi
          cd dist
          for f in *.sha256; do [ -s "$f" ] || rm -f "$f"; done
          # Normalize: the Windows runner's sha256sum emits binary-mode
          # "HASH *name" lines; keep SHA256SUMS uniform in the two-space
          # text form (the msi row was the lone starred line in 0.2.0).
          cat *.sha256 | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS
          # Check the actual bytes and enforce the complete public matrix.
          # Developer artifacts stay inside the Actions artifacts.
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          prefix = f"taskly-{version}-"
          required = {
              prefix + suffix for suffix in (
                  "macos-arm64.dmg", "macos-arm64.zip",
                  "macos-x64.dmg", "macos-x64.zip",
                  "windows-x64.msi", "windows-x64.zip",
                  "linux-arm64.tar.gz", "linux-arm64.zip",
                  "linux-x64.tar.gz", "linux-x64.zip",
                  "linux-arm64.deb", "linux-amd64.deb",
                  "linux-aarch64.AppImage", "linux-x86_64.AppImage",
                  "linux-arm64.flatpak", "linux-x64.flatpak",
              )
          }
          rows = [line.split() for line in Path("SHA256SUMS").read_text().splitlines()]
          actual = [row[1] for row in rows if len(row) == 2]
          # RPM release-number is a packaging revision, not app SemVer;
          # enforce exactly one per CPU without hard-coding the revision.
          import re
          rpm_arches = ("aarch64", "x86_64")
          rpm = [
              name for name in actual
              if re.fullmatch(re.escape(prefix) + r"[0-9]+-linux-(aarch64|x86_64)\.rpm", name)
          ]
          for arch in rpm_arches:
              matching = [name for name in rpm if name.endswith(f"-linux-{arch}.rpm")]
              if len(matching) != 1:
                  raise SystemExit(f"Expected one RPM for {arch}, found {matching}")
          required.update(rpm)
          if len(rows) != len(actual) or set(actual) != required or len(actual) != len(required):
              raise SystemExit(
                  f"Invalid release matrix: missing={sorted(required - set(actual))}, "
                  f"unexpected={sorted(set(actual) - required)}, duplicates={len(actual)-len(set(actual))}"
              )
          for name in actual:
              if not Path(name).is_file() or Path(name).stat().st_size == 0:
                  raise SystemExit(f"Missing or empty public artifact: {name}")
          PY
          # Canonical versioned packages only. SHA256SUMS replaces public
          # per-package checksums; the signed updater manifest stays mandatory.
          mapfile -t uploads < <(awk '{print $2}' SHA256SUMS)
          uploads+=( SHA256SUMS update-manifest.json )
          # Idempotent publish: a failed run leaves the release (and some
          # assets) behind; re-runs edit + re-upload over it instead of
          # colliding with "release already exists".
          #
          # These builds must be normal releases, not prereleases: the
          # updater reads the moving `releases/latest/download` manifest
          # (UPDATE.md), and GitHub's `latest` resolves only non-prerelease
          # releases. Publishing with --prerelease made every new version
          # invisible to 0.2.x clients (the feed kept pointing at the
          # previous stable). The title keeps the trust status explicit;
          # signing/notarization is a separate gate (#80).
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Taskly ${VERSION} (unsigned evaluation)" \
              --latest \
              --notes-file /tmp/notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber "${uploads[@]}"
          # A retry against a previously partially published tag must also
          # remove old sidecars and stale aliases; --clobber only replaces
          # assets with matching names.
          mapfile -t published < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for name in "${published[@]}"; do
            if ! printf '%s\n' "${uploads[@]}" | grep -Fxq "$name"; then
              gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            fi
          done
      # Family standard (movebit-origin): every public release asset carries
      # verifiable build provenance. The globs match exactly the published
      # matrix — sidecars, sbom/notices and rivet's staging dir stay out.
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
