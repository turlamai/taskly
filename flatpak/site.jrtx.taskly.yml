# Flatpak bundle manifest for the release payload (issue: the Linux
# distribution contract — deb+rpm+AppImage+Flatpak+tar.gz).
#
# CI renders the __VERSION__ / __ARCH__ / __SHA256__ placeholders from the
# linux tar.gz it just built and writes the generated manifest to the repo
# root (see .github/workflows/release.yml, the Linux job; flatpak-smoke.yml
# runs the same steps against the latest published release):
#
#   sed -e "s/__VERSION__/.../" -e "s/__ARCH__/.../" -e "s/__SHA256__/.../" \
#     flatpak/site.jrtx.taskly.yml > site.jrtx.taskly.gen.yml
#   flatpak-builder --user --force-clean --repo=repo build-dir site.jrtx.taskly.gen.yml
#   flatpak build-bundle repo taskly-<v>-linux-<arch>.flatpak site.jrtx.taskly
#
# The payload is the glaze portable runtime (bin/ launcher + lib/ embedded
# Racket CS + the built web frontend), rewritten for the glaze line in
# issue #141 slice 4. Dependency closure vs the GNOME Platform runtime
# (same measurement as the family glaze payloads): the launcher and racketcs
# declare glibc + libz.so.1 as NEEDED — all in the runtime — so there are NO
# extra modules (the rivet-line lz4/ncurses modules are gone). What the
# launcher loads dynamically: glaze's webview dlopens gtk-3 and
# webkit2gtk-4.1 (the GNOME runtime hosts Epiphany, so both ship there), and
# the updater's crypto package FFI-loads libssl.so.3 / libcrypto.so.3
# (OpenSSL 3 is part of the GNOME runtime since 48). The update check and
# download leave the sandbox, hence --share=network; the tray icon talks to
# the session StatusNotifierWatcher.
app-id: site.jrtx.taskly
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: Taskly
# The release contract bundles from branch `stable` (build-bundle arg);
# builder otherwise commits to master.
branch: stable
separate-locales: false
finish-args:
  # glaze's prefer_xwayland_backend() picks X11 exactly when DISPLAY is set
  # and WAYLAND_DISPLAY is not; granting only the X11 socket keeps that
  # decision deterministic.
  - --socket=x11
  - --device=dri
  - --share=ipc
  # Update check + artifact download leave the sandbox.
  - --share=network
  # Tray icon (StatusNotifierItem) on KDE/GNOME-with-extension sessions.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: taskly
    buildsystem: simple
    build-options:
      # The payload's launchers carry the whole program in a non-alloc ELF
      # section (.rackprog). flatpak-builder's debuginfo extraction (on by
      # default) strips those files and drops non-alloc sections: the
      # launcher survives as a stub and dies at startup. The payload ships
      # prebuilt — keep it byte-exact (family glaze-line lesson).
      no-debuginfo: true
    sources:
      - type: archive
        # The release tarball is flat (bin/, lib/ at the root, no leading
        # top-level directory); keep the layout exactly as packaged.
        strip-components: 0
        path: taskly-__VERSION__-linux-__ARCH__.tar.gz
        sha256: __SHA256__
      - type: file
        path: assets/icon-512.png
      - type: file
        path: flatpak/site.jrtx.taskly.desktop
    build-commands:
      - mkdir -p /app/taskly
      - cp -a bin lib /app/taskly/
      # The bundle's `command` resolves on the sandbox PATH (/app/bin); the
      # payload lives outside it. A wrapper execs the real binary so
      # /proc/self/exe still resolves to it (runtime layout discovery keeps
      # working). $HOME inside the sandbox is the per-app writable dir, so
      # the engine's default ~/.taskly data home stays writable.
      - mkdir -p /app/bin
      - |
        cat > /app/bin/Taskly <<'EOF'
        #!/bin/sh
        exec /app/taskly/bin/Taskly
        EOF
        chmod +x /app/bin/Taskly
      - install -Dm644 icon-512.png
                    /app/share/icons/hicolor/512x512/apps/site.jrtx.taskly.png
      - install -Dm644 site.jrtx.taskly.desktop
                    /app/share/applications/site.jrtx.taskly.desktop