<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly — 设置原型（三组偏好）</title>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  .window.setwin { width: 460px; height: auto; }
  .sbody { padding: 0 20px 14px; }

  .group { padding-top: 2px; }
  .group + .group { border-top: 1px solid var(--divider); margin-top: 4px; padding-top: 10px; }
  .gtitle {
    margin: 12px 0 2px; font-size: 11.5px; font-weight: 700;
    color: var(--ink2); letter-spacing: .02em;
  }
  .group:first-child .gtitle { margin-top: 6px; }

  .frow {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid var(--divider); padding: 12px 0; min-height: 50px;
  }
  .group .frow:last-child { border-bottom: none; }
  .frow .flabel { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink); }
  .frow .fhelp { margin-top: 2px; font-size: 11.5px; color: var(--ink3); }

  .selectwrap { position: relative; flex: none; }
  .selectwrap select {
    height: 30px; min-width: 170px; padding: 0 30px 0 10px; border: 1px solid var(--input-border);
    border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 13px;
    appearance: none; outline: none;
  }
  .selectwrap::after {
    content: ""; position: absolute; right: 11px; top: 11px; width: 7px; height: 7px;
    border-right: 1.5px solid var(--ink3); border-bottom: 1.5px solid var(--ink3);
    transform: rotate(45deg); pointer-events: none;
  }
  .selectwrap select:focus-visible { outline: 2px solid var(--today); outline-offset: 1px; }

  /* 主题：原生 radio 组，一个 Tab 位 + 方向键 */
  .segopt { position: relative; display: block; }
  .segopt input {
    position: absolute; width: 1px; height: 1px; margin: 0;
    opacity: 0; pointer-events: none;
  }
  .segopt span {
    display: block; height: 26px; padding: 0 12px; border-radius: 6px;
    font-size: 12.5px; font-weight: 500; color: var(--ink2);
    line-height: 26px; cursor: pointer;
    transition: background var(--t-fast) ease, color var(--t-fast) ease;
  }
  .segopt span:hover { color: var(--ink); }
  .segopt input:checked + span {
    background: var(--surface); color: var(--ink); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  .segopt input:focus-visible + span { outline: 2px solid var(--today); outline-offset: 1px; }

  /* 快捷键录制 */
  .shortcut { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: none; }
  .keybtn {
    height: 30px; min-width: 124px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--input-border); background: var(--bg); color: var(--ink);
    font-size: 12.5px; font-weight: 600; text-align: center;
    letter-spacing: .06em; font-variant-numeric: tabular-nums;
    transition: border-color var(--t-fast) ease, background var(--t-fast) ease, color var(--t-fast) ease;
  }
  .keybtn:hover { background: var(--hover); }
  .keybtn.rec { border-color: var(--today); color: var(--today-ink); letter-spacing: 0; }
  .keybtn.empty { color: var(--ink3); font-weight: 500; letter-spacing: 0; }
  .sclinks { display: flex; gap: 10px; }
  .linkbtn { font-size: 11.5px; color: var(--ink2); text-decoration: underline; text-underline-offset: 2px; }
  .linkbtn:hover { color: var(--ink); }
  .linkbtn:disabled { text-decoration: none; }
  .setnote {
    padding: 10px 20px; border-top: 1px solid var(--divider); background: var(--sidebar);
    font-size: 11.5px; color: var(--ink3);
  }
</style>
</head>
<body>
  <div class="window setwin" id="app">
    <div class="titlebar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="t">Taskly 设置</div>
      <div class="sp"></div>
    </div>

    <div class="sbody">
      <div class="group">
        <h2 class="gtitle">通用</h2>

        <div class="frow">
          <div>
            <div class="flabel" id="langLabel">界面语言</div>
            <div class="fhelp">默认跟随系统语言</div>
          </div>
          <div class="selectwrap">
            <select id="lang" aria-labelledby="langLabel">
              <option value="system" selected>跟随系统</option>
              <option value="zh-CN">中文（简体）</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </div>
        </div>

        <div class="frow">
          <div>
            <div class="flabel" id="themeLabel">主题</div>
            <div class="fhelp">跟随系统时会随外观自动切换</div>
          </div>
          <div class="seg" role="radiogroup" aria-labelledby="themeLabel" id="themeSeg">
            <label class="segopt"><input type="radio" name="theme" value="system"><span>跟随系统</span></label>
            <label class="segopt"><input type="radio" name="theme" value="light"><span>浅色</span></label>
            <label class="segopt"><input type="radio" name="theme" value="dark"><span>深色</span></label>
          </div>
        </div>
      </div>

      <div class="group">
        <h2 class="gtitle">新任务</h2>

        <div class="frow">
          <div>
            <div class="flabel" id="listLabel">默认清单</div>
            <div class="fhelp">快速添加的任务会进入这里</div>
          </div>
          <div class="selectwrap">
            <select id="defaultList" aria-labelledby="listLabel">
              <option value="important" selected>重要</option>
              <option value="work">工作</option>
              <option value="home">家庭</option>
              <option value="shop">购物</option>
              <option value="health">健康</option>
              <option value="study">学习</option>
              <option value="trip">旅行</option>
              <option value="idea">灵感</option>
            </select>
          </div>
        </div>

        <div class="frow">
          <div>
            <div class="flabel" id="scLabel">全局快速添加</div>
            <div class="fhelp">在任意位置唤起输入框</div>
          </div>
          <div class="shortcut">
            <button class="keybtn" id="scBtn" aria-labelledby="scLabel" aria-describedby="scValue">⌃⌥Space</button>
            <span class="sr-only" id="scValue">当前快捷键 ⌃⌥Space</span>
            <div class="sclinks">
              <button class="linkbtn" id="scReset">恢复默认</button>
              <button class="linkbtn" id="scClear">清除</button>
            </div>
          </div>
        </div>
      </div>

      <div class="group">
        <h2 class="gtitle">更新</h2>

        <div class="frow">
          <div>
            <div class="flabel" id="updateLabel">更新方式</div>
            <div class="fhelp">自动安装会在后台完成</div>
          </div>
          <div class="selectwrap">
            <select id="updateMode" aria-labelledby="updateLabel">
              <option value="auto">自动安装</option>
              <option value="ask" selected>下载后询问</option>
              <option value="notify">仅提示我</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="setnote">外观更改会应用到本机所有窗口。</div>
  </div>

  <div class="sr-only" id="live" aria-live="polite"></div>

<script src="shared.js"></script>
<script>
(function () {
  const T = window.Taskly;
  const $ = function (s) { return document.querySelector(s); };
  const $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  const DEFAULT_SHORTCUT = '⌃⌥Space';
  let shortcut = DEFAULT_SHORTCUT;
  let recording = false;

  /* ---- 主题：交给 shared.js 统一记录与跨页应用 ---- */
  function syncThemeRadios(mode) {
    $$('#themeSeg input[name="theme"]').forEach(function (r) {
      r.checked = (r.value === mode);
    });
  }

  syncThemeRadios(T.theme.get());
  T.theme.onChange(function (st) { syncThemeRadios(st.mode); });

  $('#themeSeg').addEventListener('change', function (e) {
    if (!e.target.name || e.target.name !== 'theme') return;
    const mode = e.target.value;
    T.theme.set(mode);
    const label = mode === 'system' ? '跟随系统' : (mode === 'light' ? '浅色' : '深色');
    T.announce('主题已设为' + label);
  });

  /* ---- 语言 ---- */
  $('#lang').addEventListener('change', function () {
    const label = this.options[this.selectedIndex].textContent;
    T.announce(this.value === 'system' ? '界面语言已设为跟随系统' : '界面语言已设为 ' + label);
  });

  /* ---- 默认清单 ---- */
  $('#defaultList').addEventListener('change', function () {
    const label = this.options[this.selectedIndex].textContent;
    T.announce('新任务默认加入「' + label + '」');
  });

  /* ---- 更新方式 ---- */
  $('#updateMode').addEventListener('change', function () {
    const label = this.options[this.selectedIndex].textContent;
    T.announce('更新方式已设为' + label);
  });

  /* ---- 全局快捷键录制 ---- */
  const scBtn = $('#scBtn');
  const scReset = $('#scReset');
  const scClear = $('#scClear');
  const scValue = $('#scValue');

  function renderShortcut() {
    scBtn.classList.toggle('empty', !shortcut);
    scBtn.classList.remove('rec');
    scBtn.textContent = shortcut || '未设置';
    scValue.textContent = shortcut ? '当前快捷键 ' + shortcut : '当前未设置快捷键';
    scReset.disabled = shortcut === DEFAULT_SHORTCUT;
  }

  function stopRecording() {
    if (!recording) return;
    recording = false;
    renderShortcut();
  }

  function startRecording() {
    if (recording) return;
    recording = true;
    scBtn.classList.add('rec');
    scBtn.textContent = '按下组合键…';
    T.announce('正在录制快捷键，按 Esc 取消');
  }

  function formatCombo(e) {
    const parts = [];
    if (e.ctrlKey) parts.push('⌃');
    if (e.altKey) parts.push('⌥');
    if (e.shiftKey) parts.push('⇧');
    if (e.metaKey) parts.push('⌘');
    let key = e.key;
    if (key === ' ' || key === 'Spacebar') key = 'Space';
    else if (key.length === 1) key = key.toUpperCase();
    return parts.join('') + key;
  }

  scBtn.addEventListener('click', function () {
    if (recording) stopRecording();
    else startRecording();
  });

  document.addEventListener('keydown', function (e) {
    if (!recording) return;
    e.preventDefault();
    e.stopPropagation();

    if (e.key === 'Escape') {
      stopRecording();
      T.announce('已取消录制，快捷键未更改');
      return;
    }
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].indexOf(e.key) !== -1) return;
    if (!e.ctrlKey && !e.altKey && !e.metaKey) {
      T.announce('请搭配 ⌘、⌃ 或 ⌥ 使用');
      return;
    }

    shortcut = formatCombo(e);
    stopRecording();
    T.announce('快捷键已设为 ' + shortcut);
  }, true);

  document.addEventListener('pointerdown', function (e) {
    if (recording && !scBtn.contains(e.target)) stopRecording();
  });

  scBtn.addEventListener('blur', function () {
    if (recording) stopRecording();
  });

  scReset.addEventListener('click', function () {
    stopRecording();
    shortcut = DEFAULT_SHORTCUT;
    renderShortcut();
    scBtn.focus();
    T.announce('已恢复默认快捷键 ' + DEFAULT_SHORTCUT);
  });

  scClear.addEventListener('click', function () {
    stopRecording();
    shortcut = '';
    renderShortcut();
    scBtn.focus();
    T.announce('已清除快捷键，快速添加仍可从菜单打开');
  });

  renderShortcut();
})();
</script>
</body>
</html>
