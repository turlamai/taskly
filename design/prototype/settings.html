<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskly — 设置原型（三偏好）</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ==== 设置窗（§8：语言 / 主题 / 自动检查更新）==== */
  .setwin {
    width: 460px; border-radius: 12px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    box-shadow: 0 1px 2px rgba(29,29,31,.10), 0 12px 32px rgba(29,29,31,.16), 0 32px 80px rgba(29,29,31,.20);
    transition: background .12s ease, color .12s ease;
  }
  .sbody { padding: 6px 20px 16px; }
  .frow {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid var(--divider); padding: 12px 0;
  }
  .frow:last-child { border-bottom: none; }
  .flabel { font-size: 13px; }
  .select {
    height: 30px; min-width: 170px; padding: 0 10px; border: 1px solid var(--input-border);
    border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 13px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg span { font-size: 12.5px; padding: 4px 12px; border-radius: 6px; color: var(--ink2); }
  .seg span.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(29,29,31,.14); }
  .switch { width: 38px; height: 22px; border-radius: 99px; background: var(--divider); position: relative; transition: background .12s ease; flex: none; }
  .switch::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .12s ease; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
</style>
</head>
<body>
  <div class="setwin" id="app">
    <div class="titlebar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="t">Taskly 设置</div>
      <div class="sp"></div>
      <button class="iconbtn" id="themeBtn" title="切换亮暗主题">◐</button>
    </div>
    <div class="sbody">
      <div class="frow">
        <span class="flabel">界面语言</span>
        <span class="select">中文 <span style="color:var(--ink3)">▾</span></span>
      </div>
      <div class="frow">
        <span class="flabel">主题</span>
        <span class="seg"><span class="on">跟随系统</span><span>浅色</span><span>深色</span></span>
      </div>
      <div class="frow">
        <span class="flabel">自动检查更新</span>
        <span class="switch on"></span>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('themeBtn').addEventListener('click', () => {
      document.getElementById('app').classList.toggle('dark');
    });
  </script>
</body>
</html>
